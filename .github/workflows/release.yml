name: Release

# Push a tag matching the version in extension/package.json (e.g. v0.1.0)
# to test, package and publish the extension as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension/package.json version $version. Bump the version or fix the tag."
            exit 1
          fi

      - run: npm test

      - name: Package .vsix
        run: npx --yes @vscode/vsce@3.2.1 package --skip-license -o "12dpl-debugger-$GITHUB_REF_NAME.vsix"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "12dpl-debugger-$GITHUB_REF_NAME.vsix"
          --title "12dPL Debugger $GITHUB_REF_NAME"
          --generate-notes
